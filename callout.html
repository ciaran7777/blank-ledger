<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0f4c3a">
<title>Callout Job Log</title>
<style>
:root{
  --bg:#ffffff;
  --card:#ffffff;
  --ink:#0a0a0a;
  --ink-soft:#6b6b6b;
  --line:#c7cdd0;
  --green:#0f4c3a;
  --green-dark:#0a382a;
  --amber:#b5680a;
  --red:#a3312a;
  --radius:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:16px;line-height:1.4;}
body{padding-bottom:100px;}
h1,h2,h3{font-weight:600;margin:0 0 4px;}
.header{background:var(--green);color:#fff;padding:18px 16px 16px;
  position:sticky;top:0;z-index:50;}
.header .row{display:flex;align-items:center;justify-content:space-between;}
.header h1{font-size:19px;color:#fff;}
.header .sub{font-size:13px;color:#cfe4dc;margin-top:2px;}
.icon-btn{background:rgba(255,255,255,.15);border:none;color:#fff;
  width:40px;height:40px;border-radius:10px;font-size:20px;display:flex;
  align-items:center;justify-content:center;}
.wrap{padding:16px;max-width:600px;margin:0 auto;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:14px;}
.card h2{font-size:15px;color:var(--green);text-transform:uppercase;
  letter-spacing:.03em;margin-bottom:12px;}
label{display:block;font-size:13px;color:var(--ink-soft);margin:12px 0 5px;font-weight:500;}
label:first-of-type{margin-top:0;}
input[type=text],input[type=date],input[type=tel],input[type=email],select,textarea{
  width:100%;padding:13px 12px;font-size:16px;border:1.5px solid var(--line);
  border-radius:9px;background:#fbfcfb;color:var(--ink);font-family:inherit;}
textarea{min-height:70px;resize:vertical;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);background:#fff;}
.big-btn{display:block;width:100%;padding:16px;font-size:17px;font-weight:600;
  border-radius:11px;border:none;text-align:center;cursor:pointer;margin-top:8px;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:active{background:var(--green-dark);}
.btn-outline{background:#fff;color:var(--green);border:1.5px solid var(--green);}
.btn-amber{background:var(--amber);color:#fff;}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);}
.btn-danger-text{background:transparent;color:var(--red);border:none;font-size:14px;padding:8px;}
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;
  border-top:1px solid var(--line);display:flex;z-index:50;
  padding-bottom:env(safe-area-inset-bottom);}
.tab{flex:1;border:none;background:none;padding:11px 4px 9px;display:flex;
  flex-direction:column;align-items:center;gap:3px;color:var(--ink-soft);font-size:11px;font-family:inherit;}
.tab.active{color:var(--green);}
.tab svg{width:22px;height:22px;}
.job-item{background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.job-item .code{font-weight:700;color:var(--green);font-size:14px;}
.job-item .meta{font-size:13px;color:var(--ink-soft);margin-top:2px;}
.chip{display:inline-block;background:#e6efe9;color:var(--green-dark);
  font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;margin-top:4px;}
.machine-row{border:1.5px solid var(--line);border-radius:11px;padding:14px;margin-bottom:12px;
  background:#fbfcfb;position:relative;}
.machine-row .remove{position:absolute;top:10px;right:10px;background:none;border:none;
  color:var(--red);font-size:13px;font-weight:600;}
.add-machine-btn{width:100%;padding:12px;border:1.5px dashed var(--line);border-radius:10px;
  background:none;color:var(--green);font-weight:600;font-size:15px;margin-top:4px;}
.sig-pad{border:2px solid var(--green);border-radius:9px;background:#ffffff;
  touch-action:none;width:100%;height:170px;display:block;
  box-shadow:inset 0 0 0 1px #eef4f1;}
.sig-pad-wrap{position:relative;}
.sig-pad-hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;
  color:#c7cdd0;font-size:13px;pointer-events:none;letter-spacing:.02em;}
.sig-label{display:flex;justify-content:space-between;align-items:center;margin:12px 0 5px;}
.sig-clear{font-size:12px;color:var(--ink-soft);background:none;border:none;font-weight:600;}
.field-row{display:flex;gap:10px;}
.field-row > div{flex:1;}
.empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty-state svg{width:52px;height:52px;opacity:.35;margin-bottom:10px;}
.hint{font-size:12px;color:var(--ink-soft);margin-top:6px;}
.badge-row{display:flex;gap:8px;margin-bottom:14px;}
.badge{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:10px;text-align:center;}
.badge .n{font-size:20px;font-weight:700;color:var(--green);}
.badge .l{font-size:11px;color:var(--ink-soft);}
.modal-overlay{position:fixed;inset:0;background:rgba(15,25,20,.5);z-index:100;
  display:flex;align-items:flex-end;}
.modal{background:#fff;border-radius:16px 16px 0 0;padding:20px;width:100%;
  max-height:85vh;overflow-y:auto;}
.modal h3{font-size:17px;margin-bottom:14px;}
.setup-screen{min-height:100vh;display:flex;flex-direction:column;
  justify-content:center;padding:24px;}
.setup-screen .card{margin-bottom:0;}
.toast{position:fixed;bottom:90px;left:16px;right:16px;background:var(--green-dark);
  color:#fff;padding:13px 16px;border-radius:10px;text-align:center;z-index:200;
  font-size:14px;font-weight:500;}
hr{border:none;border-top:1px solid var(--line);margin:14px 0;}
.combo-wrap{position:relative;}
.combo-list{position:absolute;top:100%;left:0;right:0;background:#fff;
  border:1.5px solid var(--green);border-top:none;border-radius:0 0 9px 9px;
  max-height:220px;overflow-y:auto;z-index:40;box-shadow:0 6px 14px rgba(0,0,0,.08);}
.combo-item{padding:12px;font-size:15px;border-bottom:1px solid var(--line);cursor:pointer;}
.combo-item.picked{color:var(--green);font-weight:600;background:#f4f9f6;}
.combo-item:last-child{border-bottom:none;}
.combo-item.add-new{color:var(--green);font-weight:600;background:#f4f9f6;}
.combo-item:active{background:#eef4f1;}
.eng-fixed{background:#fbfcfb;border:1.5px solid var(--line);border-radius:9px;
  padding:12px;font-size:15px;color:var(--ink-soft);}
</style>
</head>

  return prefix + String(n).padStart(3,'0');
}

/* ---------- Rendering ---------- */
const app = document.getElementById('app');

function render(){
  let html = '';
  if (state.screen === 'setup') html = renderSetup();
  else if (state.screen === 'jobs') html = renderJobsList();
  else if (state.screen === 'newjob') html = renderJobForm();
  else if (state.screen === 'signoff') html = renderSignoff();
  else if (state.screen === 'settings') html = renderSettings();
  else if (state.screen === 'endofday') html = renderEndOfDay();
  else if (state.screen === 'complete') html = renderComplete();
  else if (state.screen === 'deletejobs') html = renderDeleteJobs();

  if (state.modal) html += renderModal();
  if (state.toast) html += `<div class="toast">${escapeHtml(state.toast)}</div>`;

  app.innerHTML = html;
  attachHandlers();
  if (state.screen === 'signoff') setTimeout(initSignaturePads, 30);

  // Persist the in-progress job on every render so a back-button tap, accidental
  // close, or crash can never wipe out work already entered.
  if (state.draft) DB.set('draft', state.draft);
}

function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Searchable combo box: text input + filtered dropdown list, add-new pinned to top of list */
function comboField(field, list, value, mid, placeholder){
  const comboId = field + '-' + (mid || 'main');
  return `
    <div class="combo-wrap" data-combo-wrap="${comboId}">
      <input type="text" class="combo-input" data-combo-input="${field}" data-mid="${mid||''}"
        value="${escapeHtml(value)}" placeholder="${placeholder}" autocomplete="off">
      ${state.openCombo === comboId ? renderComboList(field, list, mid, comboId) : ''}
    </div>`;
}

function renderComboList(field, list, mid, comboId){
  const query = (document.querySelector(`[data-combo-input="${field}"][data-mid="${mid||''}"]`)?.value || '').toLowerCase();
  const filtered = list.filter(o => o.toLowerCase().includes(query)).sort((a,b)=>a.localeCompare(b));
  const items = filtered.slice(0, 40).map(o =>
    `<div class="combo-item" data-combo-pick="${field}" data-mid="${mid||''}" data-val="${escapeHtml(o)}">${escapeHtml(o)}</div>`).join('');
  return `
    <div class="combo-list" data-combo-list="${comboId}">
      <div class="combo-item add-new" data-combo-addnew="${field}" data-mid="${mid||''}">+ Add new…</div>
      ${items || `<div class="combo-item" style="color:var(--ink-soft);">No matches</div>`}
    </div>`;
}

function multiSelectWithCustom(field, list, selected, mid){
  const chips = (selected||[]).map(v => `
    <span class="chip" style="margin-right:5px;cursor:pointer;" data-remove-chip="${field}" data-mid="${mid}" data-val="${escapeHtml(v)}">${escapeHtml(v)} ✕</span>`).join('');
  const comboId = field + '-' + mid;
  return `
    <div style="margin-bottom:6px;">${chips || '<span class="hint">None selected</span>'}</div>
    <div class="combo-wrap" data-combo-wrap="${comboId}">
      <input type="text" class="combo-input" data-multi-combo-input="${field}" data-mid="${mid}"
        value="" placeholder="Search or add part" autocomplete="off">
      ${state.openCombo === comboId ? renderMultiComboList(field, list, selected, mid, comboId) : ''}
    </div>`;
}

function renderMultiComboList(field, list, selected, mid, comboId){
  const inputEl = document.querySelector(`[data-multi-combo-input="${field}"][data-mid="${mid}"]`);
  const query = (inputEl ? inputEl.value : '').toLowerCase();
  const filtered = list.filter(o => o.toLowerCase().includes(query)).sort((a,b)=>a.localeCompare(b));
  const items = filtered.slice(0, 40).map(o => {
    const already = (selected||[]).includes(o);
    return `<div class="combo-item${already?' picked':''}" data-multi-combo-pick="${field}" data-mid="${mid}" data-val="${escapeHtml(o)}">${escapeHtml(o)}${already?' ✓':''}</div>`;
  }).join('');
  return `
    <div class="combo-list" data-combo-list="${comboId}">
      <div class="combo-item add-new" data-multi-combo-addnew="${field}" data-mid="${mid}">+ Add new…</div>
      ${items || `<div class="combo-item" style="color:var(--ink-soft);">No matches</div>`}
    </div>`;
}

let sigPads = {};
function initSignaturePads(){
  ['engineer','customer'].forEach(who=>{
    const canvas = document.getElementById('sig-'+who);
    if (!canvas) return;
    const ratio = window.devicePixelRatio || 1;
    canvas.width = canvas.offsetWidth * ratio;
    canvas.height = canvas.offsetHeight * ratio;
    const ctx = canvas.getContext('2d');
    ctx.scale(ratio, ratio);
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    let drawing = false, lastX=0, lastY=0;
    const hintEl = document.getElementById('hint-'+who);
    const existing = state.draft[who+'Sig'];
    if (existing){
      const img = new Image();
      img.onload = ()=> ctx.drawImage(img,0,0,canvas.offsetWidth,canvas.offsetHeight);
      img.src = existing;
    }
    function pos(e){
      const rect = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: t.clientX - rect.left, y: t.clientY - rect.top };
    }
    function start(e){
      e.preventDefault(); drawing=true; const p=pos(e); lastX=p.x; lastY=p.y;
      if (hintEl) hintEl.style.display = 'none';
    }
    function move(e){
      if(!drawing) return; e.preventDefault();
      const p = pos(e);
      ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke();
      lastX=p.x; lastY=p.y;
    }
    function end(){
      if(!drawing) return;
      drawing=false;
      state.draft[who+'Sig'] = canvas.toDataURL('image/png');
      DB.set('draft', state.draft);
    }
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start, {passive:false});
    canvas.addEventListener('touchmove', move, {passive:false});
    canvas.addEventListener('touchend', end);
    sigPads[who] = { canvas, ctx };
  });
}

/* ---------- Finish job: save, then offer PDF docket + share ---------- */
function finishJob(){
  const d = state.draft;
  if (!d.engineerSig){ showToast('Engineer signature required'); return; }
  if (!d.customerSig){ showToast('Customer signature required'); return; }

  const existingIdx = state.jobs.findIndex(j=>j.id===d.id);
  if (!d.code) d.code = nextJobCode();

  if (existingIdx >= 0) state.jobs[existingIdx] = d;
  else state.jobs.push(d);

  saveState();
  DB.set('draft', null);
  state.draft = null;
  state.screen = 'complete';
  render();
}

/* ---------- Build printable docket as HTML (no external libraries needed) ---------- */
/* Encode a string as Latin-1 bytes (1 char = 1 byte, 0-255 range).
   PDF syntax is ASCII and WinAnsi text stays within this range once escaped. */
function latin1Encode(str){
  const bytes = new Uint8Array(str.length);
  for (let i=0;i<str.length;i++) bytes[i] = str.charCodeAt(i) & 0xFF;
  return bytes;
}

/* ---------- Minimal dependency-free PDF writer ---------- */
function createMiniPDF(){
  const objs = [];
  let currentOps = [];
  const pages = [];
  const images = [];
  function addObj(str){ objs.push(str); return objs.length; }
  function addImageJPEG(bytes, width, height){
    const id = images.length;
    images.push({ id, data: bytes, width, height });
    return id;
  }
  function text(x, y, str, size, bold){
    const esc = pdfEscapeText(str);
    const font = bold ? 'F2' : 'F1';
    currentOps.push(`BT /${font} ${size} Tf ${x} ${y} Td (${esc}) Tj ET`);
  }
  function pdfEscapeText(str){
    // Map to WinAnsi-compatible single bytes (Latin-1 range covers the accented
    // characters we need, e.g. the fada in Ciar\u00e1n) and escape PDF specials.
    let out = '';
    for (const ch of String(str)){
      const code = ch.codePointAt(0);
      if (code > 255){ out += '?'; continue; } // unsupported glyph, fail safe
      if (ch === '\\') out += '\\\\';
      else if (ch === '(') out += '\\(';
      else if (ch === ')') out += '\\)';
      else out += ch;
    }
    return out;
  }
  function setColor(r,g,b){ currentOps.push(`${r} ${g} ${b} rg ${r} ${g} ${b} RG`); }
  function line(x1,y1,x2,y2,w){ currentOps.push(`${w||1} w ${x1} ${y1} m ${x2} ${y2} l S`); }
  function image(id, x, y, w, h){ currentOps.push(`q ${w} 0 0 ${h} ${x} ${y} cm /Im${id} Do Q`); }
  function newPage(){ pages.push(currentOps); currentOps = []; }
  function finish(){
    pages.push(currentOps);
    const PAGE_W = 595, PAGE_H = 842;
    const catalogIdx = addObj(null);
    const pagesIdx = addObj(null);
    const font1Idx = addObj('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const font2Idx = addObj('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const imageObjIdx = {};
    images.forEach(img=>{ imageObjIdx[img.id] = addObj(null); });
    const pageIdxs = [];
    pages.forEach(ops=>{
      const contentStr = ops.join('\n');
      const contentBytes = latin1Encode(contentStr);
      const cIdx = addObj(`<< /Length ${contentBytes.length} >>\nstream\n${contentStr}\nendstream`);
      const xObjEntries = images.map(img=>`/Im${img.id} ${imageObjIdx[img.id]} 0 R`).join(' ');
      const pIdx = addObj(`<< /Type /Page /Parent ${pagesIdx} 0 R /Resources << /Font << /F1 ${font1Idx} 0 R /F2 ${font2Idx} 0 R >> /XObject << ${xObjEntries} >> >> /MediaBox [0 0 ${PAGE_W} ${PAGE_H}] /Contents ${cIdx} 0 R >>`);
      pageIdxs.push(pIdx);
    });
    objs[pagesIdx-1] = `<< /Type /Pages /Kids [${pageIdxs.map(i=>i+' 0 R').join(' ')}] /Count ${pageIdxs.length} >>`;
    objs[catalogIdx-1] = `<< /Type /Catalog /Pages ${pagesIdx} 0 R >>`;

    const chunks = [];
    let offset = 0;
    function push(s){
      const bytes = typeof s === 'string' ? latin1Encode(s) : s;
      chunks.push(bytes);
      offset += bytes.length;
    }
    const xref = [0];
    push('%PDF-1.4\n');
    for (let i=0;i<objs.length;i++){
      xref.push(offset);
      const objNum = i+1;
      const imgMatch = images.find(im=>imageObjIdx[im.id]===objNum);
      if (imgMatch){
        push(`${objNum} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${imgMatch.width} /Height ${imgMatch.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${imgMatch.data.length} >>\nstream\n`);
        push(imgMatch.data);
        push('\nendstream\nendobj\n');
      } else {
        push(`${objNum} 0 obj\n${objs[i]}\nendobj\n`);
      }
    }
    const xrefOffset = offset;
    let xrefStr = `xref\n0 ${objs.length+1}\n0000000000 65535 f \n`;
    for (let i=1;i<xref.length;i++) xrefStr += String(xref[i]).padStart(10,'0') + ' 00000 n \n';
    xrefStr += `trailer\n<< /Size ${objs.length+1} /Root ${catalogIdx} 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;
    push(xrefStr);

    let total = 0; chunks.forEach(c=>total+=c.length);
    const out = new Uint8Array(total);
    let pos = 0; chunks.forEach(c=>{ out.set(c,pos); pos+=c.length; });
    return out;
  }
  return { text, line, image, addImageJPEG, setColor, newPage, finish, PAGE_W:595, PAGE_H:842 };
}

/* Decode a data URL (base64 PNG/JPEG) into raw bytes */
function dataURLToBytes(dataUrl){
  const base64 = dataUrl.split(',')[1];
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

/* Convert a signature canvas (transparent PNG) to a JPEG data URL on a white background,
   since the PDF writer only supports JPEG (DCTDecode). Returns a Promise<{bytes,width,height}>. */
function sigToJPEGBytes(dataUrl, targetWidthPx){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      const c = document.createElement('canvas');
      const scale = targetWidthPx / img.width;
      c.width = targetWidthPx;
      c.height = Math.round(img.height * scale);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const jpegUrl = c.toDataURL('image/jpeg', 0.85);
      resolve({ bytes: dataURLToBytes(jpegUrl), width: c.width, height: c.height });
    };
    img.src = dataUrl;
  });
}

let LOGO_JPEG_CACHE = null;
function getLogoJPEGBytes(){
  if (LOGO_JPEG_CACHE) return Promise.resolve(LOGO_JPEG_CACHE);
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      const c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(img, 0, 0);
      const jpegUrl = c.toDataURL('image/jpeg', 0.9);
      LOGO_JPEG_CACHE = { bytes: dataURLToBytes(jpegUrl), width: c.width, height: c.height };
      resolve(LOGO_JPEG_CACHE);
    };
    img.src = 'data:image/png;base64,' + LOGO_B64;
  });
}

/* Wrap text to fit a max width using a rough average character-width estimate (Helvetica) */
function wrapText(str, maxChars){
  const words = String(str).split(' ');
  const lines = [];
  let cur = '';
  words.forEach(w=>{
    const test = cur ? cur + ' ' + w : w;
    if (test.length > maxChars && cur){ lines.push(cur); cur = w; }
    else cur = test;
  });
  if (cur) lines.push(cur);
  return lines;
}

/* ---------- Build the actual PDF docket ---------- */
async function buildDocketPDFBytes(d){
  const doc = createMiniPDF();
  const margin = 44;
  const pageW = doc.PAGE_W, pageH = doc.PAGE_H;
  let y = pageH - 50;

  const logo = await getLogoJPEGBytes();
  const logoW = 130, logoH = logoW * (logo.height/logo.width);
  const logoId = doc.addImageJPEG(logo.bytes, logo.width, logo.height);
  doc.image(logoId, margin, y - logoH, logoW, logoH);
  y -= logoH + 22;

  doc.line(margin, y, pageW - margin, y, 1);
  y -= 26;

  doc.text(margin, y, 'Callout docket ' + d.code, 16, true);
  y -= 22;

  const info = [
    ['Client / site', d.site],
    ['Date', d.date],
    ['Engineer', engineer().name + ' (' + engineer().phone + ')'],
    ['Reason for callout', d.reason || '-'],
    ['Time on site', d.timeOnSite || '-'],
    ['Customer contact', [d.customer.name, d.customer.phone, d.customer.email].filter(Boolean).join(' / ') || '-']
  ];
  info.forEach(([label, val])=>{
    doc.text(margin, y, label + ':', 10, true);
    const wrapped = wrapText(val, 70);
    wrapped.forEach((line, i)=>{
      doc.text(margin + 130, y - (i*13), line, 10, false);
    });
    y -= Math.max(14, wrapped.length * 13) + 4;
  });

  y -= 8;
  doc.line(margin, y, pageW - margin, y, 0.5);
  y -= 22;

  doc.text(margin, y, 'Machines serviced', 12, true);
  y -= 18;

  d.machines.forEach((m,i)=>{
    if (y < 120){ doc.newPage(); y = pageH - 50; }
    doc.text(margin, y, (i+1) + '. ' + (m.machine || 'Unspecified machine') + (m.serial ? '  (' + m.serial + ')' : ''), 10.5, true);
    y -= 14;
    const mPartsReplaced = Array.isArray(m.partsReplaced) ? m.partsReplaced : [];
    const mPartsNeeded = Array.isArray(m.partsNeeded) ? m.partsNeeded : [];
    const pr = 'Parts replaced: ' + (mPartsReplaced.length ? mPartsReplaced.join(', ') : 'none');
    const pn = 'Parts needed: ' + (mPartsNeeded.length ? mPartsNeeded.join(', ') : 'none');
    [pr, pn].forEach(line=>{
      wrapText(line, 95).forEach(l=>{ doc.text(margin+14, y, l, 9.5, false); y -= 12; });
    });
    y -= 6;
  });

  if (d.followOn){
    if (y < 100){ doc.newPage(); y = pageH - 50; }
    doc.text(margin, y, 'Follow on', 11, true); y -= 14;
    wrapText(d.followOn, 100).forEach(l=>{ doc.text(margin, y, l, 9.5, false); y -= 12; });
    y -= 8;
  }
  if (d.notes){
    if (y < 100){ doc.newPage(); y = pageH - 50; }
    doc.text(margin, y, 'Notes', 11, true); y -= 14;
    wrapText(d.notes, 100).forEach(l=>{ doc.text(margin, y, l, 9.5, false); y -= 12; });
    y -= 8;
  }

  if (y < 160){ doc.newPage(); y = pageH - 50; }
  y -= 10;
  doc.line(margin, y, pageW - margin, y, 0.5);
  y -= 24;

  const sigW = (pageW - margin*2 - 24) / 2;
  const sigTargetPx = 400;

  doc.text(margin, y, 'Engineer signature', 10.5, true);
  doc.text(margin + sigW + 24, y, 'Customer signature', 10.5, true);
  y -= 8;

  const [engSig, custSig] = await Promise.all([
    sigToJPEGBytes(d.engineerSig, sigTargetPx),
    sigToJPEGBytes(d.customerSig, sigTargetPx)
  ]);
  const engSigH = sigW * (engSig.height/engSig.width);
  const custSigH = sigW * (custSig.height/custSig.width);
  const engId = doc.addImageJPEG(engSig.bytes, engSig.width, engSig.height);
  const custId = doc.addImageJPEG(custSig.bytes, custSig.width, custSig.height);
  doc.image(engId, margin, y - engSigH, sigW, engSigH);
  doc.image(custId, margin + sigW + 24, y - custSigH, sigW, custSigH);
  y -= Math.max(engSigH, custSigH) + 8;

  doc.text(margin, y, engineer().name + ', ' + engineer().phone, 8.5, false);
  doc.text(margin + sigW + 24, y, d.customerSignName || 'Customer', 8.5, false);

  return doc.finish();
}

/* Generate the PDF and hand it to Android's native share sheet (Gmail, WhatsApp, etc),
   falling back to a plain download if sharing isn't supported on this browser. */
async function sharePDF(d){
  showToast('Building PDF…');
  const bytes = await buildDocketPDFBytes(d);
  const filename = 'Callout_' + d.code + '_' + d.site.replace(/\s+/g,'_') + '.pdf';
  const blob = new Blob([bytes], { type: 'application/pdf' });

  if (navigator.canShare && navigator.share){
    const file = new File([blob], filename, { type: 'application/pdf' });
    if (navigator.canShare({ files: [file] })){
      try {
        await navigator.share({
          files: [file],
          title: 'Callout docket ' + d.code,
          text: 'Callout docket ' + d.code + ' for ' + d.site + '.'
        });
        return;
      } catch(e){
        if (e.name === 'AbortError') return;
      }
    }
  }
  // Fallback: download the PDF directly
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 4000);
  showToast('PDF downloaded — attach it to an email manually');
}

/* ---------- CSV / JSON export (internal backup only) ---------- */
function downloadCSV(jobs, filename){
  const headers = ['Job Code','Submission Date','Client / site','Reason for callout','Time on site','Machine','Serial Number (Location)','Parts replaced','Parts needed','Follow on','Customer Name','Customer Phone','Customer Email'];
  const rows = [headers];
  jobs.forEach(j=>{
    const machines = (j.machines && j.machines.length) ? j.machines : [{}];
    machines.forEach(m=>{
      const partsReplaced = Array.isArray(m.partsReplaced) ? m.partsReplaced : [];
      const partsNeeded = Array.isArray(m.partsNeeded) ? m.partsNeeded : [];
      const customer = j.customer || {};
      rows.push([
        j.code || '—', j.date || '—', j.site || '—', j.reason || '—', j.timeOnSite || '—', m.machine || '—', m.serial || '—',
        partsReplaced.length ? partsReplaced.join('; ') : '—',
        partsNeeded.length ? partsNeeded.join('; ') : '—',
        j.followOn || '—',
        customer.name || '—', customer.phone || '—', customer.email || '—'
      ]);
    });
  });
  const csv = rows.map(r => r.map(csvEscape).join(',')).join('\r\n');
  triggerDownload(csv, filename + '.csv', 'text/csv');
}
function csvEscape(v){
  v = (v===undefined||v===null) ? '' : String(v);
  if (/[",\r\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
  return v;
}
function downloadJSON(jobs, filename){
  triggerDownload(JSON.stringify(jobs, null, 2), filename + '.json', 'application/json');
}
function triggerDownload(content, filename, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  // Some Android browsers read the blob asynchronously after the click, so
  // revoking the URL immediately can produce an empty or truncated download.
  // Give it a moment before releasing the object URL.
  setTimeout(()=> URL.revokeObjectURL(url), 4000);
}
